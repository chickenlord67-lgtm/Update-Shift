name: Build Update Shift

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Android
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get install -y cmake ninja-build

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27
          add-to-path: true

      - name: Clone Geode SDK
        run: |
          git clone https://github.com/geode-sdk/geode --depth 1 geode-sdk
          cd geode-sdk && git submodule update --init --recursive

      - name: Patch clang version check
        run: |
          python3 -c "
          import re
          f = open('geode-sdk/CMakeLists.txt', 'r')
          content = f.read()
          f.close()
          content = re.sub(r'if\s*\(\s*CLANG_VERSION_MAJOR\s+LESS\s+19\s*\)', 'if(FALSE)', content)
          f = open('geode-sdk/CMakeLists.txt', 'w')
          f.write(content)
          f.close()
          print('patched CMakeLists.txt')
          "
          grep -n "CLANG_VERSION_MAJOR" geode-sdk/CMakeLists.txt

      - name: Configure
        run: |
          NDK=${{ steps.ndk.outputs.ndk-path }}
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-23 \
            -DCMAKE_BUILD_TYPE=Release \
            -DGEODE_TARGET_PLATFORM=Android64 \
            -DCMAKE_C_COMPILER=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang \
            -DCMAKE_CXX_COMPILER=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++ \
            -DGEODE_SDK=$PWD/geode-sdk

      - name: Build
        run: cmake --build build -j4

      - uses: actions/upload-artifact@v4
        with:
          name: update-shift-android
          path: build/*.geode
