name: Build Update Shift

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Clang 19
        run: |
          sudo apt-get install -y clang-19 lld-19 cmake ninja-build
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-19 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-19 100

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Clone Geode SDK
        run: |
          git clone https://github.com/geode-sdk/geode --depth 1 geode-sdk
          cd geode-sdk && git submodule update --init --recursive

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-23 \
            -DCMAKE_BUILD_TYPE=Release \
            -DGEODE_TARGET_PLATFORM=Android64 \
            -DCMAKE_C_COMPILER=clang-19 \
            -DCMAKE_CXX_COMPILER=clang++-19 \
            -DGEODE_SDK=$PWD/geode-sdk

      - name: Build
        run: cmake --build build -j4

      - uses: actions/upload-artifact@v4
        with:
          name: update-shift-android
          path: build/*.geode

  build-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone Geode SDK
        run: |
          git clone https://github.com/geode-sdk/geode --depth 1 geode-sdk
          cd geode-sdk
          git submodule update --init --recursive

      - name: Configure
        run: |
          cmake -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DGEODE_TARGET_PLATFORM=Win64 `
            -DCMAKE_C_COMPILER="C:/Program Files/LLVM/bin/clang.exe" `
            -DCMAKE_CXX_COMPILER="C:/Program Files/LLVM/bin/clang++.exe" `
            -DGEODE_SDK=$pwd/geode-sdk

      - name: Build
        run: cmake --build build --config Release -j4

      - uses: actions/upload-artifact@v4
        with:
          name: update-shift-windows
          path: build/Release/*.geode
