name: Build Update Shift

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Android
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get install -y cmake ninja-build unzip

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27
          add-to-path: true

      - name: Clone Geode SDK
        run: |
          git clone https://github.com/geode-sdk/geode --depth 1 geode-sdk
          cd geode-sdk && git submodule update --init --recursive

      - name: Patch clang version check
        run: |
          python3 -c "
          f = open('geode-sdk/CMakeLists.txt', 'r')
          content = f.read()
          f.close()
          content = content.replace('if (CMAKE_CXX_COMPILER_VERSION VERSION_LESS \"19.0\")', 'if (FALSE)')
          f = open('geode-sdk/CMakeLists.txt', 'w')
          f.write(content)
          f.close()
          print('patched')
          "

      - name: Install Geode binaries
        run: |
          curl -sL https://github.com/geode-sdk/geode/releases/latest/download/geode-android64.zip -o geode-android.zip
          unzip geode-android.zip -d geode-bins
          mkdir -p geode-sdk/bin/android64
          cp geode-bins/*.so geode-sdk/bin/android64/ 2>/dev/null || true
          cp geode-bins/*.a geode-sdk/bin/android64/ 2>/dev/null || true
          ls geode-sdk/bin/android64/

      - name: Configure
        run: |
          NDK=${{ steps.ndk.outputs.ndk-path }}
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-23 \
            -DCMAKE_BUILD_TYPE=Release \
            -DGEODE_TARGET_PLATFORM=Android64 \
            -DCMAKE_C_COMPILER=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang \
            -DCMAKE_CXX_COMPILER=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++ \
            -DGEODE_SDK=$PWD/geode-sdk

      - name: Build
        run: cmake --build build -j4

      - uses: actions/upload-artifact@v4
        with:
          name: update-shift-android
          path: build/*.geode
