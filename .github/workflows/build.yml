name: Build Update Shift

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Clone Geode SDK
        run: |
          git clone https://github.com/geode-sdk/geode --depth 1 geode-sdk
          cd geode-sdk
          git submodule update --init --recursive

      - name: Configure
        run: |
          export ANDROID_NDK=$ANDROID_NDK_ROOT
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-23 \
            -DCMAKE_BUILD_TYPE=Release \
            -DGEODE_TARGET_PLATFORM=Android \
            -DGEODE_SDK=$(pwd)/geode-sdk

      - name: Build
        run: cmake --build build --config Release -j4

      - uses: actions/upload-artifact@v4
        with:
          name: update-shift-android
          path: build/*.geode

  build-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone Geode SDK
        run: |
          git clone https://github.com/geode-sdk/geode --depth 1 geode-sdk
          cd geode-sdk
          git submodule update --init --recursive

      - name: Configure
        run: |
          cmake -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DGEODE_TARGET_PLATFORM=Win64 `
            -DGEODE_SDK=$pwd/geode-sdk

      - name: Build
        run: cmake --build build --config Release -j4

      - uses: actions/upload-artifact@v4
        with:
          name: update-shift-windows
          path: build/Release/*.geode
