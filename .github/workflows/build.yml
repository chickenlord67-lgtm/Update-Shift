name: Build Update Shift

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Setup Geode SDK
        uses: geode-sdk/build-geode-mod/setup@main

      - name: Build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64

      - uses: actions/upload-artifact@v4
        with:
          name: update-shift-android
          path: ${{ steps.build.outputs.build-output }}

  build-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Geode SDK
        uses: geode-sdk/build-geode-mod/setup@main

      - name: Build
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Win64

      - uses: actions/upload-artifact@v4
        with:
          name: update-shift-windows
          path: ${{ steps.build.outputs.build-output }}
